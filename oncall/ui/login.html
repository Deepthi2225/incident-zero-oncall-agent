<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in: P0ppy On-call agent</title>
<style>
  :root { color-scheme:dark; --paper:#170a13; --card:#26131f; --ink:#fdf1f1; --soft:#c9aeb9; --line:#4d2c42; --accent:#f2ab9f; --bad:#ff8d98;
          --font:"Inter","Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,sans-serif; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:16px; overflow:hidden; background:var(--paper); color:var(--ink); font:15px/1.5 var(--font); }
  .waves { position:fixed; inset:0; width:100%; height:100%; }
  main { position:relative; width:100%; max-width:380px; padding:30px 28px; background:var(--card); border:1px solid var(--line); border-radius:14px; box-shadow:0 10px 30px rgba(10,2,8,.45); }
  .brand { display:flex; align-items:center; gap:11px; margin-bottom:22px; }
  .brand svg { width:44px; height:44px; }
  h1 { margin:0; color:#fff6f4; font:800 32px/1 var(--font); letter-spacing:-.045em; } h1 span { color:var(--accent); }
  p { margin:4px 0 0; color:var(--soft); font-size:13px; }
  label { display:block; margin-top:14px; color:var(--soft); font-size:13px; }
  input { width:100%; margin-top:5px; padding:10px 12px; border:1px solid var(--line); border-radius:9px; background:var(--paper); color:var(--ink); font:inherit; }
  input:focus-visible, button:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
  button { width:100%; margin-top:20px; padding:11px; border:0; border-radius:9px; background:var(--accent); color:#2b0509; font:700 15px var(--font); cursor:pointer; }
  button:disabled { opacity:.6; cursor:default; }
  #msg { min-height:20px; margin-top:12px; color:var(--bad); font-size:13.5px; }
  code { display:block; margin-top:10px; padding:10px; border-radius:8px; background:var(--paper); color:var(--ink); font:12.5px "Cascadia Code",Consolas,monospace; word-break:break-word; }
</style>
</head>
<body>
<svg class="waves" viewBox="0 0 1200 800" preserveAspectRatio="xMaxYMid slice" aria-hidden="true">
  <path fill="#2b1022" d="M300 0C560 240 620 560 420 800H1200V0Z"/>
  <path fill="#431a34" d="M560 0C780 240 820 560 640 800H1200V0Z"/>
  <path fill="#5c2a4b" d="M800 0C960 220 980 580 840 800H1200V0Z"/>
  <path fill="#774669" d="M980 0C1080 220 1090 570 1000 800H1200V0Z"/>
  <path fill="#b57f8a" d="M1090 0C1130 130 1160 260 1200 330V0Z"/>
</svg>
<main>
  <div class="brand">
    <svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="18" fill="none" stroke="#f2ab9f" stroke-width="6"/><path d="M1 25h12l4-10 7 19 5-13 2 4h16" fill="none" stroke="#26131f" stroke-width="9" stroke-linejoin="round"/><path d="M2 25h11l4-10 7 19 5-13 2 4h15" fill="none" stroke="#fff6f4" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div><h1>P<span>0</span>ppy</h1><p>On-call agent. Your little buddy for big incidents.</p></div>
  </div>
  <div id="setup" hidden>
    <p>No accounts exist yet. In a terminal in the project folder, create the first one, then reload this page:</p>
    <code>python -m oncall user add yourname --role admin</code>
  </div>
  <form id="form">
    <label>Name<input id="name" autocomplete="username" required autofocus></label>
    <label>Password<input id="password" type="password" autocomplete="current-password" required></label>
    <button id="go">Sign in</button>
    <div id="msg" role="alert"></div>
  </form>
</main>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
fetch("/api/setup").then((r) => r.json()).then((s) => { if (s.needs_account) { $("setup").hidden = false; $("form").hidden = true; } });
$("form").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  $("go").disabled = true; $("msg").textContent = "";
  try {
    const r = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ name: $("name").value, password: $("password").value }) });
    if (r.ok) { location.replace("/"); return; }
    $("msg").textContent = (await r.json()).error || "Could not sign in.";
  } catch (e) { $("msg").textContent = "Could not reach P0ppy."; }
  $("password").value = ""; $("go").disabled = false;
});
</script>
</body>
</html>
